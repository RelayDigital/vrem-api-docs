<svg width="2400" height="1500" viewBox="0 0 2400 1500" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Vremly emerald card (dark), AnimatedGradientBackground at rest. CSS: radial-gradient(130% 150% at 50% 20%, #0a0a0a 20%, #042f2e 35%, #064e3b 45%, #059669 55%, #34d399 65%, #6ee7b7 80%, #059669 100%) -->
<!-- Box-relative, so it stretches exactly to any box. -->
<defs>
<radialGradient id="vremly-card-dark" gradientUnits="objectBoundingBox" cx="0" cy="0" r="1" gradientTransform="matrix(1.3 0 0 1.5 0.5 0.2)">
<stop offset="0.2" stop-color="#0A0A0A"/>
<stop offset="0.35" stop-color="#042F2E"/>
<stop offset="0.45" stop-color="#064E3B"/>
<stop offset="0.55" stop-color="#059669"/>
<stop offset="0.65" stop-color="#34D399"/>
<stop offset="0.8" stop-color="#6EE7B7"/>
<stop offset="1" stop-color="#059669"/>
</radialGradient>
</defs>
<rect width="2400" height="1500" fill="url(#vremly-card-dark)"/>
</svg>
